name: Deploy ChessCam to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: chess_cam_mvp/package-lock.json
      - name: Install dependencies
        working-directory: chess_cam_mvp
        run: npm install
      - name: Build site
        working-directory: chess_cam_mvp
        run: npm run build -- --base=/chesss/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: chess_cam_mvp/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
