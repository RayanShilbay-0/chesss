name: Deploy ChessCam to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-browser-stable-run
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: chess_cam_mvp
        run: npm install
      - name: Validate JavaScript and camera inference tests
        working-directory: chess_cam_mvp
        run: npm run check
      - name: Build site
        working-directory: chess_cam_mvp
        run: npm run build -- --base=/chesss/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: chess_cam_mvp/dist
      - name: Install real browser integration test dependencies
        working-directory: chess_cam_mvp
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Download known-chess-position screenshot fixtures for pretrained model
        working-directory: chess_cam_mvp
        run: |
          mkdir -p public/test-fixtures
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/scoriiu/fenshot/main/packages/fenshot/tests/fixtures/chesscom-italian-white.png \
            -o public/test-fixtures/chesscom-italian-white.png
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/scoriiu/fenshot/main/packages/fenshot/tests/fixtures/lichess-italian-black.png \
            -o public/test-fixtures/lichess-italian-black.png
      - name: Download known Lichess cburnett piece assets for moving-board test
        working-directory: chess_cam_mvp
        run: |
          mkdir -p public/test-fixtures/cburnett
          for side in w b; do
            for piece in P R N B Q K; do
              curl --fail --location --retry 3 --silent --show-error \
                "https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/cburnett/${side}${piece}.svg" \
                -o "public/test-fixtures/cburnett/${side}${piece}.svg"
            done
          done
      - name: Test real pretrained ONNX chess-piece recognition in Chromium
        working-directory: chess_cam_mvp
        run: npm run test:ai-e2e
      - name: Test continuous white and black moves through trained CNN model
        working-directory: chess_cam_mvp
        run: npm run test:live-ai-e2e
      - name: Verify the default Stockfish 19 Full WASM engine in Chromium
        working-directory: chess_cam_mvp
        run: npm run test:full-engine-e2e
      - name: Save browser failure screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chesscam-browser-tests
          path: chess_cam_mvp/test-artifacts/
          if-no-files-found: ignore
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
