name: Deploy ChessCam to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-verified-browser-tests
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: chess_cam_mvp
        run: npm install
      - name: Validate JavaScript and camera inference tests
        working-directory: chess_cam_mvp
        run: npm run check
      - name: Install real browser integration test dependencies
        working-directory: chess_cam_mvp
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test ChessCam with an actual headless browser and synthetic chess camera
        working-directory: chess_cam_mvp
        run: npm run test:e2e
      - name: Save browser failure screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chesscam-browser-tests
          path: chess_cam_mvp/test-artifacts/
          if-no-files-found: ignore
      - name: Build site
        working-directory: chess_cam_mvp
        run: npm run build -- --base=/chesss/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: chess_cam_mvp/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
